
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171321">
  <title>Diwali Ticket System</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #171321;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .card {
      width: 100%;
      max-width: 480px;
      padding: 24px;
      border-radius: 18px;
      background: #282238;
      box-shadow: 0 10px 35px #0005;
    }

    h1 {
      color: #ffcf70;
    }

    input,
    button {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #aaa;
      background: white;
      color: #20152b;
    }

    button {
      border: 0;
      background: #ffcf70;
      color: #20152b;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #reader {
      margin-top: 16px;
      overflow: hidden;
      border-radius: 10px;
    }

    #result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 10px;
      background: #393047;
      overflow-wrap: anywhere;
      line-height: 1.5;
    }

    .allowed {
      color: #8cffae;
    }

    .denied {
      color: #ff9292;
    }

    .info {
      color: #ffdc8e;
    }

    .small {
      color: #c9c2d5;
      font-size: 13px;
      line-height: 1.6;
    }

    .ticket {
      font-size: 21px;
      font-weight: bold;
      overflow-wrap: anywhere;
      color: #ffcf70;
      margin: 12px 0;
    }

    .qr-container {
      display: inline-block;
      max-width: 100%;
      padding: 12px;
      margin: 12px auto;
      border-radius: 12px;
      background: white;
    }

    .qr-container img {
      display: block;
      width: 260px;
      max-width: 100%;
      height: auto;
    }

    .guest-instructions {
      padding: 12px;
      margin-top: 16px;
      background: #393047;
      border-radius: 10px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 400px) {
      .card {
        padding: 18px;
      }

      .qr-container img {
        width: 230px;
      }
    }
  </style>
</head>

<body>
  <main class="card" id="app">
    <h1>🪔 Diwali Party</h1>
    <p>Loading...</p>
  </main>

  <script>
    // YOUR EXISTING GOOGLE APPS SCRIPT WEB APP URL
    const API_URL =
      "https://script.google.com/macros/s/AKfycbzir-1Vc65MMHkuzPUNskFg39dBMOLYstz7EtNfrcmuR4GZFP9P36RgVxnUpnfIIPJO/exec";

    const app = document.getElementById("app");
    const params = new URLSearchParams(window.location.search);
    const guestTicket = params.get("ticket");

    // ==================================================
    // GUEST PAGE: DISPLAY TICKET AND QR CODE
    // ==================================================

    if (guestTicket) {
      app.innerHTML = `
        <h1>🎉 You're Invited! 🪔</h1>

        <p>Welcome, Superstar!</p>

        <p>
          Get ready for a night of lights,
          music and masti.
        </p>

        <h3 style="color:#ffcf70">
          Your Entry QR Code
        </h3>

        <div class="qr-container" id="guestQr">
          <p style="color:#20152b">
            Generating your QR code...
          </p>
        </div>

        <p>Your ticket code:</p>

        <div class="ticket" id="guestCode"></div>

        <div class="guest-instructions">
          <p>📱 Show this QR code to the entry staff.</p>
          <p class="small">
            Entry is confirmed after staff scans
            and validates your ticket.
          </p>
        </div>

        <p class="small">
          Keep this ticket private. It is valid
          for one entry only.
        </p>
      `;

      document.getElementById("guestCode").textContent =
        guestTicket;

      const guestLink = window.location.href;
      const qrContainer = document.getElementById("guestQr");
      const qrImage = document.createElement("img");

      qrImage.alt = "Diwali party entry QR code";
      qrImage.width = 260;
      qrImage.height = 260;

      qrImage.onload = () => {
        qrContainer.replaceChildren(qrImage);
      };

      qrImage.onerror = () => {
        qrContainer.innerHTML = `
          <p style="color:#20152b">
            QR code could not load.
            Check your internet connection and refresh.
          </p>
        `;
      };

      qrImage.src =
        "https://api.qrserver.com/v1/create-qr-code/" +
        "?size=260x260&data=" +
        encodeURIComponent(guestLink);

    } else {

      // ==================================================
      // STAFF PAGE: PASSWORD-PROTECTED SCANNER
      // ==================================================

      app.innerHTML = `
        <h1>🪔 Diwali Entry Gate</h1>

        <p>Staff access only</p>

        <input
          id="staffPassword"
          type="password"
          placeholder="Enter password"
          autocomplete="current-password"
          aria-label="Enter staff password"
        >

        <button id="startBtn">
          Verify Password & Start Camera
        </button>

        <button id="stopBtn" class="hidden">
          Stop Camera
        </button>

        <div id="reader"></div>

        <div id="result" role="status" aria-live="polite">
          Enter the staff password to start the scanner.
        </div>

        <p class="small">
          Valid tickets are accepted once.
          Previously used tickets are rejected.
        </p>
      `;

      let scanner = null;
      let busy = false;
      let callbackCounter = 0;
      let staffAuthenticated = false;

      const resultBox = document.getElementById("result");
      const startBtn = document.getElementById("startBtn");
      const stopBtn = document.getElementById("stopBtn");
      const passwordInput = document.getElementById("staffPassword");

      function showResult(message, type = "info") {
        resultBox.className = type;
        resultBox.textContent = message;
      }

      // ==================================================
      // BACKEND REQUEST USING JSONP
      // ==================================================

      function staffRequest(action, code = "") {
        const password = passwordInput.value;

        return new Promise((resolve, reject) => {
          const callbackName =
            "diwaliCallback" +
            Date.now() +
            (++callbackCounter);

          const script = document.createElement("script");
          let finished = false;
          let timeout;

          function cleanup() {
            if (finished) return;

            finished = true;
            clearTimeout(timeout);
            script.remove();
            delete window[callbackName];
          }

          timeout = setTimeout(() => {
            cleanup();
            reject(new Error("Request timed out"));
          }, 15000);

          window[callbackName] = (data) => {
            cleanup();

            if (!data || !data.status) {
              reject(new Error("Invalid server response"));
              return;
            }

            resolve(data);
          };

          script.onerror = () => {
            cleanup();
            reject(new Error("Could not reach the server"));
          };

          const query = new URLSearchParams({
            action: action,
            password: password,
            callback: callbackName
          });

          if (code) {
            query.set("code", code);
          }

          script.src = API_URL + "?" + query.toString();
          document.body.appendChild(script);
        });
      }

      // ==================================================
      // EXTRACT CODE FROM SCANNED QR
      // ==================================================

      function extractTicketCode(text) {
        try {
          const url = new URL(text);
          const code = url.searchParams.get("ticket");

          if (code) {
            return code.trim();
          }
        } catch (error) {
          // Older QR codes may contain just the ticket code.
        }

        return text.trim();
      }

      // ==================================================
      // VERIFY PASSWORD, THEN START CAMERA
      // ==================================================

      startBtn.onclick = async () => {
        if (staffAuthenticated) {
          await startCamera();
          return;
        }

        if (!passwordInput.value) {
          showResult(
            "Please enter the staff password first.",
            "denied"
          );
          passwordInput.focus();
          return;
        }

        startBtn.disabled = true;
        showResult("Verifying password...", "info");

        try {
          const auth = await staffRequest("auth");

          if (!auth || auth.status !== "AUTH_OK") {
            staffAuthenticated = false;
            passwordInput.value = "";

            showResult(
              "Incorrect password. Please try again.",
              "denied"
            );

            passwordInput.focus();
            return;
          }

          staffAuthenticated = true;
          showResult(
            "Password accepted. Starting camera...",
            "allowed"
          );

          await startCamera();

        } catch (error) {
          showResult(
            "Could not verify password. Check internet " +
            "connection and backend deployment.",
            "denied"
          );

        } finally {
          startBtn.disabled = false;
        }
      };

      // Allow Enter key to submit the password.
      passwordInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          startBtn.click();
        }
      });

      // ==================================================
      // START CAMERA
      // ==================================================

      async function startCamera() {
        try {
          if (!staffAuthenticated) {
            showResult(
              "Enter the correct password first.",
              "denied"
            );
            return;
          }

          if (scanner && scanner.isScanning) {
            return;
          }

          if (!scanner) {
            scanner = new Html5Qrcode("reader");
          }

          await scanner.start(
            { facingMode: "environment" },
            {
              fps: 10,
              qrbox: {
                width: 250,
                height: 250
              }
            },

            async (text) => {
              if (busy || !staffAuthenticated) {
                return;
              }

              busy = true;
              showResult("Checking ticket...", "info");

              try {
                const code = extractTicketCode(text);
                const data = await staffRequest("validate", code);

                if (data.status === "ALLOWED") {
                  showResult(
                    "✅ " + data.message,
                    "allowed"
                  );

                } else if (data.status === "ALREADY_USED") {
                  showResult(
                    "⛔ " + data.message,
                    "denied"
                  );

                } else if (data.status === "UNAUTHORIZED") {
                  staffAuthenticated = false;
                  passwordInput.value = "";

                  showResult(
                    "Staff authentication failed. " +
                    "Enter the password again.",
                    "denied"
                  );

                } else {
                  showResult(
                    "❌ " + data.message,
                    "denied"
                  );
                }

              } catch (error) {
                showResult(
                  "Connection error. Check the internet " +
                  "connection and try again.",
                  "denied"
                );

              } finally {
                setTimeout(() => {
                  busy = false;
                }, 2500);
              }
            }
          );

          startBtn.classList.add("hidden");
          stopBtn.classList.remove("hidden");

          showResult(
            "Camera on! Scan a ticket QR. 📸",
            "info"
          );

        } catch (error) {
          showResult(
            "Camera error: " + (error.message || error),
            "denied"
          );
        }
      }

      // ==================================================
      // STOP CAMERA
      // ==================================================

      stopBtn.onclick = async () => {
        try {
          if (scanner && scanner.isScanning) {
            await scanner.stop();
          }

          staffAuthenticated = false;
          passwordInput.value = "";

          startBtn.textContent =
            "Verify Password & Start Camera";

          startBtn.classList.remove("hidden");
          stopBtn.classList.add("hidden");

          showResult(
            "Camera stopped. Enter password to start again.",
            "info"
          );

        } catch (error) {
          showResult(
            "Could not stop camera: " +
            (error.message || error),
            "denied"
          );
        }
      };
    }
  </script>
</body>
</html>
